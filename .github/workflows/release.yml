name: Publish Charts
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
concurrency:
  group: charts-publish
  cancel-in-progress: false
jobs:
  publish-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      needed: ${{ steps.registry.outputs.needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Start a hosted runner only for an unpublished npm version
        id: registry
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs'
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'))
          if (process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error('Tag does not match package version')
          const url = `https://registry.npmjs.org/${encodeURIComponent(name).replace('%40', '@')}/${encodeURIComponent(version)}`
          const response = await fetch(url, { signal: AbortSignal.timeout(15000) })
          if (response.status !== 404 && !response.ok) throw new Error(`npm returned HTTP ${response.status}`)
          if (response.ok) {
            const published = await response.json()
            if (published.name !== name || published.version !== version) throw new Error('Unexpected registry version')
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `needed=${response.status === 404}\n`)
          NODE

  publish:
    needs: publish-check
    if: needs.publish-check.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.5.1
      - name: Admit the release version
        uses: tangle-network/agent-runtime/.github/actions/admit-release@db1cc4314c3cfcc287469e0880b37a9bf25a6dbb
        with:
          directories: .
          consumer: '@tangle-network/sandbox-ui@2.0.20 (Discovery shared presentation)'

      - name: Publish with provenance
        run: npm publish --access public --provenance --tag legacy
